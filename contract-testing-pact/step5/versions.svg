<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="330" fill="#ffffff"/>

  <!-- Lanes -->
  <rect x="10" y="20" width="780" height="150" rx="10" fill="#fff4e6" stroke="#e5b77a"/>
  <text x="30" y="88" font-size="14" font-weight="bold" fill="#8a5a14">UserService</text>
  <text x="30" y="106" font-size="11" fill="#8a5a14">provider · sends</text>
  <rect x="10" y="185" width="780" height="130" rx="10" fill="#eef4ff" stroke="#9db4e0"/>
  <text x="30" y="246" font-size="14" font-weight="bold" fill="#2b4c8c">OrderService</text>
  <text x="30" y="264" font-size="11" fill="#2b4c8c">consumer · reads</text>

  <!-- UserService versions -->
  <rect x="190" y="35" width="160" height="120" rx="6" fill="#fff" stroke="#d39a4f"/>
  <text x="270" y="57" text-anchor="middle" font-size="14" font-weight="bold">1.0.0</text>
  <text x="270" y="72" text-anchor="middle" font-size="11" fill="#777">in production</text>
  <text x="215" y="96" font-size="13" font-family="monospace">id</text>
  <text x="215" y="114" font-size="13" font-family="monospace" fill="#2b6cb0" font-weight="bold">name</text>
  <text x="215" y="132" font-size="13" font-family="monospace">email</text>

  <rect x="400" y="35" width="160" height="120" rx="6" fill="#fff" stroke="#d39a4f"/>
  <text x="480" y="57" text-anchor="middle" font-size="14" font-weight="bold">1.1.0</text>
  <text x="480" y="72" text-anchor="middle" font-size="11" fill="#777">adds full_name</text>
  <text x="425" y="96" font-size="13" font-family="monospace">id</text>
  <text x="425" y="112" font-size="13" font-family="monospace" fill="#2b6cb0" font-weight="bold">name</text>
  <text x="425" y="128" font-size="13" font-family="monospace" fill="#c05621" font-weight="bold">full_name</text>
  <text x="425" y="144" font-size="13" font-family="monospace">email</text>

  <rect x="610" y="35" width="160" height="120" rx="6" fill="#fff" stroke="#d39a4f"/>
  <text x="690" y="57" text-anchor="middle" font-size="14" font-weight="bold">2.0.0</text>
  <text x="690" y="72" text-anchor="middle" font-size="11" fill="#777">removes name</text>
  <text x="635" y="96" font-size="13" font-family="monospace">id</text>
  <text x="635" y="114" font-size="13" font-family="monospace" fill="#c05621" font-weight="bold">full_name</text>
  <text x="635" y="132" font-size="13" font-family="monospace">email</text>

  <!-- OrderService versions -->
  <rect x="190" y="205" width="160" height="90" rx="6" fill="#fff" stroke="#6b8cc7"/>
  <text x="270" y="227" text-anchor="middle" font-size="14" font-weight="bold">1.0.0</text>
  <text x="270" y="242" text-anchor="middle" font-size="11" fill="#777">in production</text>
  <text x="215" y="266" font-size="13" font-family="monospace">id</text>
  <text x="215" y="284" font-size="13" font-family="monospace" fill="#2b6cb0" font-weight="bold">name</text>

  <rect x="610" y="205" width="160" height="90" rx="6" fill="#fff" stroke="#6b8cc7" stroke-dasharray="6,4"/>
  <text x="690" y="227" text-anchor="middle" font-size="14" font-weight="bold">2.0.0</text>
  <text x="690" y="242" text-anchor="middle" font-size="11" fill="#777">you build it in this step</text>
  <text x="635" y="266" font-size="13" font-family="monospace">id</text>
  <text x="635" y="284" font-size="13" font-family="monospace" fill="#c05621" font-weight="bold">full_name</text>

  <!-- Arrows -->
  <g stroke="#888" stroke-width="1.6" fill="none">
    <line x1="350" y1="95" x2="396" y2="95" marker-end="url(#arrow)"/>
    <line x1="560" y1="95" x2="606" y2="95" marker-end="url(#arrow)"/>
    <line x1="350" y1="250" x2="606" y2="250" marker-end="url(#arrow)"/>
  </g>
</svg>
