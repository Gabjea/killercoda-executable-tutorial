<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="430" fill="#ffffff"/>

  <!-- Participants -->
  <rect x="40" y="20" width="200" height="58" rx="8" fill="#f3eefe" stroke="#a58bd6"/>
  <text x="140" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#4b2f86">Pact verifier</text>
  <text x="140" y="64" text-anchor="middle" font-size="11" fill="#555">reads the contract</text>

  <rect x="430" y="20" width="200" height="58" rx="8" fill="#fff4e6" stroke="#d39a4f"/>
  <text x="530" y="45" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a14">UserService</text>
  <text x="530" y="64" text-anchor="middle" font-size="11" fill="#555">real code, one version</text>

  <rect x="660" y="120" width="120" height="50" rx="6" fill="#fff" stroke="#999"/>
  <text x="720" y="142" text-anchor="middle" font-size="12" font-weight="bold" font-family="monospace">states.json</text>
  <text x="720" y="159" text-anchor="middle" font-size="10" fill="#666">test data</text>

  <!-- Lifelines -->
  <line x1="140" y1="78" x2="140" y2="410" stroke="#bbb" stroke-dasharray="4,4"/>
  <line x1="530" y1="78" x2="530" y2="410" stroke="#bbb" stroke-dasharray="4,4"/>

  <!-- Step 1 -->
  <circle cx="22" cy="125" r="11" fill="#4b2f86"/><text x="22" y="129" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
  <text x="335" y="112" text-anchor="middle" font-size="12" font-weight="bold">Set up provider state</text>
  <text x="335" y="127" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">"user 1 exists"</text>
  <line x1="140" y1="136" x2="526" y2="136" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="530" y1="145" x2="656" y2="145" stroke="#999" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="593" y="186" text-anchor="middle" font-size="10" fill="#666">loads the users</text>
  <text x="593" y="199" text-anchor="middle" font-size="10" fill="#666">for that state</text>

  <!-- Step 2 -->
  <circle cx="22" cy="240" r="11" fill="#4b2f86"/><text x="22" y="244" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
  <text x="335" y="228" text-anchor="middle" font-size="12" font-weight="bold">Replay the request</text>
  <text x="335" y="243" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">GET /users/1</text>
  <line x1="140" y1="252" x2="526" y2="252" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="335" y="282" text-anchor="middle" font-size="11" font-family="monospace" fill="#333">200 {"id": 1, "name": "Ada Lovelace", ...}</text>
  <line x1="530" y1="292" x2="144" y2="292" stroke="#444" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <circle cx="22" cy="355" r="11" fill="#4b2f86"/><text x="22" y="359" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
  <rect x="44" y="322" width="330" height="70" rx="6" fill="#f3eefe" stroke="#a58bd6"/>
  <text x="58" y="343" font-size="12" font-weight="bold">Compare with the contract</text>
  <text x="58" y="362" font-size="11" fill="#333">is <tspan font-family="monospace">id</tspan> an integer?  <tspan fill="#246b3a" font-weight="bold">✓</tspan></text>
  <text x="58" y="380" font-size="11" fill="#333">is <tspan font-family="monospace">name</tspan> a string?  <tspan fill="#246b3a" font-weight="bold">✓</tspan></text>

  <text x="530" y="365" text-anchor="middle" font-size="11" fill="#777">No OrderService involved:</text>
  <text x="530" y="380" text-anchor="middle" font-size="11" fill="#777">the contract replaces it</text>
</svg>
