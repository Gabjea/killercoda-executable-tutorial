<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="510" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="20" y="30" width="220" height="310" rx="10" fill="#eef4ff" stroke="#9db4e0"/>
  <text x="130" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4c8c">Development</text>
  <rect x="290" y="30" width="220" height="310" rx="10" fill="#fff4e6" stroke="#e5b77a"/>
  <text x="400" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a14">Deployment (Git as CI/CD)</text>
  <rect x="560" y="30" width="220" height="310" rx="10" fill="#eaf7ee" stroke="#8cc79f"/>
  <text x="670" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#246b3a">Production (Docker)</text>

  <!-- Development -->
  <rect x="40" y="80" width="180" height="52" rx="6" fill="#fff" stroke="#6b8cc7"/>
  <text x="130" y="102" text-anchor="middle" font-size="13" font-weight="bold">order-service</text>
  <text x="130" y="120" text-anchor="middle" font-size="11" fill="#555">Git repo · consumer</text>
  <rect x="40" y="150" width="180" height="52" rx="6" fill="#fff" stroke="#6b8cc7"/>
  <text x="130" y="172" text-anchor="middle" font-size="13" font-weight="bold">user-service</text>
  <text x="130" y="190" text-anchor="middle" font-size="11" fill="#555">Git repo · provider</text>
  <rect x="40" y="250" width="180" height="60" rx="6" fill="#fff" stroke="#6b8cc7"/>
  <text x="130" y="274" text-anchor="middle" font-size="13" font-weight="bold">Contract tests</text>
  <text x="130" y="293" text-anchor="middle" font-size="11" fill="#555">run-tests · verify-provider</text>

  <!-- Deployment -->
  <rect x="310" y="80" width="180" height="60" rx="6" fill="#fff" stroke="#d39a4f"/>
  <text x="400" y="104" text-anchor="middle" font-size="13" font-weight="bold">pre-push hook</text>
  <text x="400" y="123" text-anchor="middle" font-size="11" fill="#555">deployment gate (step 6)</text>
  <rect x="310" y="170" width="180" height="52" rx="6" fill="#fff" stroke="#d39a4f"/>
  <text x="400" y="192" text-anchor="middle" font-size="13" font-weight="bold">production remote</text>
  <text x="400" y="210" text-anchor="middle" font-size="11" fill="#555">bare Git repos</text>
  <rect x="310" y="250" width="180" height="60" rx="6" fill="#fff" stroke="#d39a4f"/>
  <text x="400" y="274" text-anchor="middle" font-size="13" font-weight="bold">post-receive hook</text>
  <text x="400" y="293" text-anchor="middle" font-size="11" fill="#555">roll out new version</text>

  <!-- Production -->
  <rect x="580" y="80" width="180" height="52" rx="6" fill="#fff" stroke="#5aa874"/>
  <text x="670" y="102" text-anchor="middle" font-size="13" font-weight="bold">OrderService</text>
  <text x="670" y="120" text-anchor="middle" font-size="11" fill="#555">port 8080</text>
  <rect x="580" y="210" width="180" height="52" rx="6" fill="#fff" stroke="#5aa874"/>
  <text x="670" y="232" text-anchor="middle" font-size="13" font-weight="bold">UserService</text>
  <text x="670" y="250" text-anchor="middle" font-size="11" fill="#555">internal only</text>

  <!-- Broker band -->
  <rect x="290" y="410" width="220" height="70" rx="10" fill="#f3eefe" stroke="#a58bd6"/>
  <text x="400" y="436" text-anchor="middle" font-size="14" font-weight="bold" fill="#4b2f86">Pact Broker</text>
  <text x="400" y="455" text-anchor="middle" font-size="11" fill="#555">contracts · verification results</text>
  <text x="400" y="470" text-anchor="middle" font-size="11" fill="#555">deployments · port 9292</text>
  <rect x="580" y="418" width="180" height="54" rx="10" fill="#f3eefe" stroke="#a58bd6"/>
  <text x="670" y="450" text-anchor="middle" font-size="13" font-weight="bold" fill="#4b2f86">PostgreSQL</text>

  <!-- Arrows -->
  <g stroke="#444" stroke-width="1.6" fill="none">
    <line x1="220" y1="141" x2="306" y2="112" marker-end="url(#arrow)"/>
    <line x1="400" y1="140" x2="400" y2="166" marker-end="url(#arrow)"/>
    <line x1="400" y1="222" x2="400" y2="246" marker-end="url(#arrow)"/>
    <line x1="490" y1="280" x2="576" y2="243" marker-end="url(#arrow)"/>
    <line x1="670" y1="132" x2="670" y2="206" marker-end="url(#arrow)"/>
    <polyline points="130,310 130,445 286,445" marker-end="url(#arrow)"/>
    <line x1="400" y1="310" x2="400" y2="406" marker-end="url(#arrow)"/>
    <line x1="510" y1="445" x2="576" y2="445" marker-end="url(#arrow)"/>
    <polyline points="490,110 535,110 535,428 514,428" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  </g>

  <!-- Arrow labels -->
  <g font-size="11" fill="#333">
    <text x="236" y="114">deploy</text>
    <text x="408" y="158">allowed</text>
    <text x="583" y="282">rolls out</text>
    <text x="678" y="174">GET /users/{id}</text>
    <text x="138" y="385">publish contracts</text>
    <text x="138" y="399">and results</text>
    <text x="408" y="365">record deployment</text>
    <text x="548" y="376" transform="rotate(90 548 376)" text-anchor="middle">can-i-deploy?</text>
  </g>
</svg>
