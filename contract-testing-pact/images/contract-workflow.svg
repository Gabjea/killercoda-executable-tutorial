<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#ffffff"/>

  <!-- Consumer team -->
  <rect x="20" y="30" width="220" height="250" rx="10" fill="#eef4ff" stroke="#9db4e0"/>
  <text x="130" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b4c8c">OrderService team</text>
  <text x="130" y="72" text-anchor="middle" font-size="11" fill="#2b4c8c">consumer</text>
  <rect x="40" y="90" width="180" height="56" rx="6" fill="#fff" stroke="#6b8cc7"/>
  <text x="130" y="113" text-anchor="middle" font-size="13" font-weight="bold">Consumer tests</text>
  <text x="130" y="132" text-anchor="middle" font-size="11" fill="#555">run-tests order-service</text>
  <rect x="40" y="196" width="180" height="56" rx="6" fill="#fff" stroke="#6b8cc7"/>
  <text x="130" y="219" text-anchor="middle" font-size="13" font-weight="bold">Pact file</text>
  <text x="130" y="238" text-anchor="middle" font-size="11" fill="#555">the contract</text>

  <!-- Broker -->
  <rect x="290" y="90" width="220" height="162" rx="10" fill="#f3eefe" stroke="#a58bd6"/>
  <text x="400" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b2f86">Pact Broker</text>
  <text x="400" y="150" text-anchor="middle" font-size="12" fill="#333">contracts</text>
  <text x="400" y="166" text-anchor="middle" font-size="11" fill="#666">per consumer version</text>
  <text x="400" y="198" text-anchor="middle" font-size="12" fill="#333">verification results</text>
  <text x="400" y="214" text-anchor="middle" font-size="11" fill="#666">per provider version</text>

  <!-- Provider team -->
  <rect x="560" y="30" width="220" height="250" rx="10" fill="#fff4e6" stroke="#e5b77a"/>
  <text x="670" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a14">UserService team</text>
  <text x="670" y="72" text-anchor="middle" font-size="11" fill="#8a5a14">provider</text>
  <rect x="580" y="140" width="180" height="62" rx="6" fill="#fff" stroke="#d39a4f"/>
  <text x="670" y="166" text-anchor="middle" font-size="13" font-weight="bold">Provider verification</text>
  <text x="670" y="186" text-anchor="middle" font-size="11" fill="#555">verify-provider 1.0.0</text>

  <!-- Deployment gate (later) -->
  <rect x="290" y="320" width="220" height="56" rx="10" fill="#fff" stroke="#888" stroke-dasharray="5,4"/>
  <text x="400" y="344" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">Deployment gate</text>
  <text x="400" y="363" text-anchor="middle" font-size="11" fill="#666">can-i-deploy (step 6)</text>

  <!-- Arrows -->
  <g stroke="#444" stroke-width="1.6" fill="none">
    <line x1="130" y1="146" x2="130" y2="192" marker-end="url(#arrow)"/>
    <line x1="220" y1="224" x2="286" y2="200" marker-end="url(#arrow)"/>
    <line x1="510" y1="150" x2="576" y2="160" marker-end="url(#arrow)"/>
    <line x1="580" y1="186" x2="514" y2="196" marker-end="url(#arrow)"/>
    <line x1="400" y1="320" x2="400" y2="256" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11" fill="#222">
    <text x="138" y="174">writes</text>
    <text x="240" y="200" font-weight="bold">1</text><text x="250" y="200">publish</text>
    <text x="520" y="138" font-weight="bold">2</text><text x="530" y="138">fetch</text>
    <text x="518" y="222" font-weight="bold">3</text><text x="528" y="222">results</text>
    <text x="408" y="292">asks: compatible?</text>
  </g>
</svg>
